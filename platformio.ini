; DSO152 alternative firmware - Carlos Santa Kich, MIT licence (see README).
;
; Bare-metal C (CMSIS registers only). The image is linked at 0x08003C00,
; the slot where the FNIRSI bootloader puts and starts the application, and
; must end before 0x0800F800 (settings page; FNIRSI calibration at 0x0800FC00).
; `pio run` writes out/DSO152_APP_V0.1.bin (tools/check_image.py). Install:
; hold OK while switching on and copy that file to the DSO BOOT drive.

[platformio]
default_envs = dso152

[env:dso152]
platform = ststm32@19.0.0
board = genericSTM32F103R8
framework = cmsis
board_build.ldscript = ld/dso152_app.ld
build_flags =
    -Wall
    -DSTM32F103xB
extra_scripts = post:tools/check_image.py
